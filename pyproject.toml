[project]
name = "pi-arc-sidecar"
version = "0.0.0"
description = "Python environment boundary for pi-arc"
requires-python = "==3.12.9"
dependencies = [
    "arc-agi==0.9.9",
    "arcengine==0.9.3",
    "pillow==12.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage==7.10.7",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".delta",
    ".venv",
    "build",
    "coverage",
    "dist",
    "game-cache",
    "node_modules",
    "run-artifacts",
    "tmp",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# 中文语义注释是项目规范；RUF002/RUF003 会把中文全角标点误判为可疑字符。
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
include = ["python", "scripts/python", "tests/python", "tests/support"]
extraPaths = ["python"]
exclude = [
    ".venv",
    "build",
    "coverage",
    "dist",
    "game-cache",
    "node_modules",
    "run-artifacts",
    "tmp",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-W", "error"]
testpaths = ["tests/python"]
pythonpath = ["python"]
markers = [
    "contract: cross-language contract plumbing",
]

[tool.coverage.run]
branch = true
source = ["python/pi_arc_sidecar"]

[tool.coverage.report]
show_missing = true
skip_covered = false
